  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Константы ──

    const TOTAL_QUESTIONS = 10;
    const API_URL = "https://api.deepseek.com/chat/completions";
    const MODEL = "deepseek-chat";

    const EVAL_TEMPERATURE = 0.2;

    const TTS_STORAGE = "mc_quiz_tts";
    const HISTORY_STORAGE = "mc_quiz_history";
    const HISTORY_LIMIT = 20;

      "крафт и рецепты",

      "зельеварение",
      "зачарования",

      "Край",

      { question: "Из каких блоков делается верстак?", correct_answer: "Из четырёх досок", acceptable_answers: ["четыре доски", "4 доски", "доски"], difficulty: "easy" },
      { question: "Какой моб появляется, если молния ударит в свинью?", correct_answer: "Зомбифицированный пиглин", acceptable_answers: ["зомбифицированный пиглин", "зомби-пиглин", "свинозомби"], difficulty: "hard" },
      { question: "Сколько блоков обсидиана нужно для портала в Нижний мир?", correct_answer: "Минимум 10 блоков", acceptable_answers: ["10", "минимум 10", "десять"], difficulty: "medium" },
      { question: "Какой предмет нужен, чтобы добыть алмазную руду?", correct_answer: "Железная кирка или лучше", acceptable_answers: ["железная кирка", "алмазная кирка", "незеритовая кирка"], difficulty: "easy" },
      { question: "Как называется босс, обитающий в Энде?", correct_answer: "Дракон Края (Эндер-дракон)", acceptable_answers: ["дракон края", "эндер-дракон", "дракон"], difficulty: "easy" },

      { question: "Какой блок нельзя сдвинуть поршнем?", correct_answer: "Обсидиан", acceptable_answers: ["обсидиан", "обсидиановый блок"], difficulty: "medium" },
      { question: "Как приручить волка в Minecraft?", correct_answer: "Дать ему кость", acceptable_answers: ["кость", "кости", "дать кость"], difficulty: "easy" },

      { question: "Сколько голов скелетов-визеров нужно для призыва Визера?", correct_answer: "Три головы", acceptable_answers: ["3", "три", "три головы"], difficulty: "hard" },

    // ── Вызов API (DeepSeek) ──

    async function callAI(apiKey, systemPrompt, userPrompt, opts = {}) {
      const { temperature = GEN_TEMPERATURE, timeoutMs = API_TIMEOUT_MS, json = true } = opts;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const body = {
          model: MODEL,
          max_tokens: 1000,
          temperature,
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userPrompt },
          ],
        };
        if (json) body.response_format = { type: "json_object" };
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey,
          },
          body: JSON.stringify(body),
          signal: controller.signal,
        });
        if (!resp.ok) throw new Error("API error " + resp.status);
        const data = await resp.json();
        return data.choices[0].message.content;
      } finally {
        clearTimeout(timer);
      }
    }

    function parseJSON(raw) {
      const cleaned = raw.replace(/```json|```/g, "").trim();
      try {
        return JSON.parse(cleaned);
      } catch (e) {
        const start = cleaned.indexOf("{");
        const end = cleaned.lastIndexOf("}");
        if (start !== -1 && end > start) return JSON.parse(cleaned.slice(start, end + 1));
        throw e;
      }
    }

    // ── Промпты ──

    const QUESTION_EXAMPLES = [
      { question: "Какой моб взрывается, подкравшись к игроку?", correct_answer: "Крипер", acceptable_answers: ["крипер", "криппер"], difficulty: "easy" },
      { question: "Из какого блока добывается редстоун?", correct_answer: "Из редстоуновой руды", acceptable_answers: ["редстоуновая руда", "руда редстоуна", "красная руда"], difficulty: "easy" },
      { question: "Что нужно добавить к арбузу в верстаке, чтобы получить сверкающий арбуз?", correct_answer: "Золотые самородки (восемь штук)", acceptable_answers: ["золотые самородки", "золотой самородок", "8 золотых самородков"], difficulty: "medium" },
      { question: "Сколько единиц железа нужно на полный комплект железной брони?", correct_answer: "24 слитка", acceptable_answers: ["24", "двадцать четыре", "24 слитка"], difficulty: "medium" },
      { question: "Какое зелье варится из паучьего глаза?", correct_answer: "Зелье отравления", acceptable_answers: ["зелье отравления", "отравление", "зелье яда"], difficulty: "medium" },
      { question: "Какой предмет нужно держать в руке, чтобы эндермен не нападал, когда на него смотришь?", correct_answer: "Никакой — эндермен нападает от взгляда в любом случае; безопасно смотреть можно, только надев на голову тыкву", acceptable_answers: ["никакой", "никакой не поможет", "тыква на голове", "резная тыква"], difficulty: "hard" },
    ];

    const QUESTION_SYSTEM_PROMPT = [
      "Ты — составитель вопросов для викторины по Minecraft (Java Edition).",
      "",
      "Жёсткие требования:",
      "- Вопрос — только о реальной механике, предмете, мобе, блоке или структуре игры, которые можно проверить по Minecraft Wiki. Ничего не выдумывай.",
      "- Ответ должен быть коротким и однозначным.",
      "- Используй официальную русскую локализацию терминов: Нижний мир, Край, крипер, эндермен, редстоун.",
      "- Перед выводом проверь себя: убедись, что вопрос относится к реальной игре и на него существует один общепризнанный ответ.",
      "",
      'Отвечай ТОЛЬКО валидным JSON без markdown и пояснений. Формат: {"question":"...","correct_answer":"...","acceptable_answers":["...","..."],"difficulty":"easy|medium|hard"}',
      "Поле acceptable_answers — массив из 2–4 допустимых вариантов ответа: синонимы и разговорные названия.",
      "",
      "Примеры хороших вопросов:",
      ...QUESTION_EXAMPLES.map((ex) => JSON.stringify(ex)),
    ].join("\n");

    const DIFFICULTY_PROMPT = {
      mixed: "любая — сам выбери easy, medium или hard",
      easy: "строго easy (простой вопрос)",
      medium: "строго medium (средний вопрос)",
      hard: "строго hard (сложный вопрос)",
    };

    function buildQuestionUserPrompt(topic, history, difficulty) {
      const hist = (history || []).map((q) => "- " + q).join("\n");
      return [
        "Придумай один вопрос для викторины по Minecraft на русском языке.",
        "Тема вопроса: " + topic + ".",
        "Сложность: " + (DIFFICULTY_PROMPT[difficulty] || DIFFICULTY_PROMPT.mixed) + ".",
        "",

        hist || "пока нет",
        "",
        "Верни JSON.",
      ].join("\n");
    }

    const EVAL_SYSTEM_PROMPT = 'Ты — судья викторины по Minecraft (Java Edition). Оцени ответ игрока по 5-балльной шкале. Игрок отвечает голосом, поэтому прощай опечатки, огрехи распознавания речи и разговорные формулировки. Отвечай ТОЛЬКО валидным JSON без markdown. Формат: {"score":число_от_1_до_5,"comment":"краткий дружелюбный комментарий на русском","correct_answer":"полный правильный ответ"}';

    function buildEvalUserPrompt(q, playerAnswer) {
      const lines = [
        "Вопрос: " + q.question,
        "Правильный ответ: " + q.correct_answer,
      ];
      if (q.acceptable_answers && q.acceptable_answers.length) {
        lines.push("Допустимые варианты ответа (синонимы и разговорные названия — засчитывай их как верные): " + q.acceptable_answers.join("; "));
      }
      lines.push(
        "Ответ игрока: " + playerAnswer,
        "",
        "Шкала: 5 = верно или совпадает по смыслу с любым допустимым вариантом, 4 = по сути верно, но неточно, 3 = частично верно, 2 = слабо, но что-то угадал, 1 = неверно. Дай короткий дружелюбный комментарий в стиле Minecraft."
      );
      return lines.join("\n");
    }

    // ── Утилиты вопросов ──

    function normalizeQuestion(raw) {
      if (!raw || typeof raw !== "object") return null;
      const question = typeof raw.question === "string" ? raw.question.trim() : "";
      const correct = typeof raw.correct_answer === "string" ? raw.correct_answer.trim() : "";
      if (!question || !correct) return null;
      const difficulty = ["easy", "medium", "hard"].includes(raw.difficulty) ? raw.difficulty : "medium";
      const acceptable = Array.isArray(raw.acceptable_answers)
        ? raw.acceptable_answers
            .filter((a) => typeof a === "string" && a.trim())
            .map((a) => a.trim())
            .slice(0, 6)
        : [];
      return { question, correct_answer: correct, difficulty, acceptable_answers: acceptable };
    }

    function pickFallbackQuestion(idx, difficulty) {
      const filtered = difficulty && difficulty !== "mixed"
        ? FALLBACK_QUESTIONS.filter((q) => q.difficulty === difficulty)
        : FALLBACK_QUESTIONS;
      const bank = filtered.length ? filtered : FALLBACK_QUESTIONS;
      return bank[idx % bank.length];
    }

    function createTopicQueue(topics, rng = Math.random) {
      let pool = [];
      return {
        next() {
          if (!pool.length) {
            pool = topics.slice();
            for (let i = pool.length - 1; i > 0; i--) {
              const j = Math.floor(rng() * (i + 1));
              [pool[i], pool[j]] = [pool[j], pool[i]];
            }
          }
          return pool.pop();
        },
        reset() { pool = []; },
      };
    }

    // ── Локальная оценка (fallback без API) ──

    function localScore(playerAnswer, q) {
      const norm = (s) => String(s).toLowerCase()
        .replace(/ё/g, "е")
        .replace(/[^а-яa-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      const stem = (w) => (w.length > 3 ? w.slice(0, Math.max(3, w.length - 2)) : w);
      const wordMatches = (pw, w) => {
        if (/^\d+$/.test(w) || /^\d+$/.test(pw)) return pw === w;
        return pw.startsWith(stem(w)) || w.startsWith(stem(pw));
      };
      const pa = norm(playerAnswer);
      const paWords = pa.split(" ").filter(Boolean);
      const refs = [q.correct_answer, ...(q.acceptable_answers || [])];
      let best = 1;
      for (const ref of refs) {
        const ca = norm(ref);
        if (!ca) continue;
        let s = 1;
        if (pa === ca) s = 5;
        else {
          // значимые слова: длиннее 2 букв, а числа — любой длины
          const words = ca.split(" ").filter((w) => w.length > 2 || /^\d+$/.test(w));
          if (words.length && words.every((w) => paWords.some((pw) => wordMatches(pw, w)))) s = 4;
          else if (words.some((w) => paWords.some((pw) => wordMatches(pw, w)))) s = 3;
        }
        if (s > best) best = s;
        if (best === 5) break;
      }
      return {
        score: best,
        comment: best >= 4 ? "Отлично!" : best >= 3 ? "Почти!" : "Не совсем...",
        correct_answer: q.correct_answer,
      };
    }

    // ── История результатов ──

    function loadHistory() {
      try {
        const h = JSON.parse(localStorage.getItem(HISTORY_STORAGE) || "[]");
        return Array.isArray(h) ? h : [];
      } catch (e) {
        return [];
      }
    }

    function saveGameResult(entry) {
      const h = [entry, ...loadHistory()].slice(0, HISTORY_LIMIT);
      try { localStorage.setItem(HISTORY_STORAGE, JSON.stringify(h)); } catch (e) {}
      return h;
    }

    function bestTotal(history) {
      return history.reduce((m, g) => Math.max(m, g.total || 0), 0);
    }

    // ── Озвучка (SpeechSynthesis) ──

    function speak(text) {
      if (!window.speechSynthesis || !text) return;
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "ru-RU";
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function stopSpeaking() {
      try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
    }

    // ── Коррекция Minecraft-терминов ──
    // Русский ASR часто искажает игровую терминологию — исправляем фонетически близкие варианты.
    // ВАЖНО: \b в JS-регулярках не работает с кириллицей (она не входит в \w),
    // поэтому границы слов строим вручную через [^а-яёa-z0-9].

    const RAW_CORRECTIONS = [
      ["энд[эе]р", "эндер"],
      ["ендер", "эндер"],
      ["эндермэн", "эндермен"],
      ["эндермэна", "эндермена"],
      ["крипп?ер", "крипер"],
      ["ви[зс]ер", "визер"],
      ["вай[зс]ер", "визер"],
      ["пиглен", "пиглин"],
      ["пигл[иы]н", "пиглин"],
      ["пик[лн]\\s*ин", "пиглин"],
      ["р[иэе]д\\s*стон", "редстоун"],
      ["р[иэе]дстоун", "редстоун"],
      ["ред\\s*стоун", "редстоун"],
      ["обс[иы]д[иы]ан", "обсидиан"],
      ["апс[иы]д[иы]ан", "обсидиан"],
      ["опс[иы]д[иы]ан", "обсидиан"],
      ["нотш", "нотч"],
      ["ноч", "нотч"],
      ["крафт[иы]нг", "крафтинг"],
      ["зомб[иы]фиц[иы]рованный", "зомбифицированный"],
      ["зомб[иы]фицированн?ый", "зомбифицированный"],
      ["зомб[иы]пиглин", "зомбифицированный пиглин"],
      ["не[зс]ер[иы]т", "незерит"],
      ["нез[еэ]р[иы]т", "незерит"],
      ["не[зс]ер", "незер"],
      ["ниж[нь]+[иы]й\\s*мир", "нижний мир"],
      ["нижн[ий]+\\s*мир", "нижний мир"],
      ["зачарован[ие]+", "зачарование"],
      ["зачаровывание", "зачарование"],
      ["спаун", "спавн"],
      ["спавм", "спавн"],
      ["крафт\\s*верстак", "верстак"],
      ["фарм[иы]нг", "фарминг"],
      ["г[рл][иы]фер", "грифер"],
      ["текстур\\s*пак", "текстурпак"],
      ["шулк[еэ]р", "шалкер"],
      ["шалк[еэ]р", "шалкер"],
      ["иллюз[ои]р", "иллюзор"],
      ["ч[уе]д[иы]ще", "чудище"],
      ["бл[еэ][йи][зс]", "блейз"],
      ["га[зс]т", "гаст"],
      ["сла[йи]м", "слайм"],
      ["гол[еэ]м", "голем"],
    ];

    const WORD_BOUND = "[^а-яёa-z0-9]";
    const MC_CORRECTIONS = RAW_CORRECTIONS.map(([pattern, replacement]) => [
      new RegExp("(^|" + WORD_BOUND + ")(?:" + pattern + ")(?=" + WORD_BOUND + "|$)", "gi"),
      (m, p1) => p1 + replacement,
    ]);

    function correctMinecraftTerms(text) {
      let result = text;
      for (const [pattern, replacement] of MC_CORRECTIONS) {
        result = result.replace(pattern, replacement);
      }
      return result;
    }

    // ── Распознавание речи ──

    function useSpeechRecognition() {
      const [supported, setSupported] = useState(false);
      const [listening, setListening] = useState(false);
      const [transcript, setTranscript] = useState("");
      const recogRef = useRef(null);

      useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
          setSupported(true);
          const r = new SR();
          r.lang = "ru-RU";
          r.continuous = false;
          r.interimResults = true;
          r.onresult = (e) => {
            let t = "";
            for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
            setTranscript(correctMinecraftTerms(t));
          };
          r.onend = () => setListening(false);
          r.onerror = () => setListening(false);
          recogRef.current = r;
        }
      }, []);

      const start = useCallback(() => {
        const r = recogRef.current;
        if (!r) return;
        setTranscript("");
        try {
          r.start();
          setListening(true);
        } catch (e) {
          // InvalidStateError: распознавание уже запущено — игнорируем
        }
      }, []);

      const stop = useCallback(() => {
        try { recogRef.current && recogRef.current.stop(); } catch (e) {}
      }, []);

      return { supported, listening, transcript, start, stop, setTranscript };
    }

    // ── Приложение ──

    function MinecraftQuiz() {
      const [screen, setScreen] = useState("start");
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || "");
      const [apiKeyInput, setApiKeyInput] = useState("");
      const [apiKeyError, setApiKeyError] = useState("");
      const [apiKeyTesting, setApiKeyTesting] = useState(false);
      const [currentQ, setCurrentQ] = useState(null);
      const [questionNum, setQuestionNum] = useState(0);
      const [scores, setScores] = useState([]);
      const [evaluation, setEvaluation] = useState(null);
      const [loading, setLoading] = useState(false);
      const [loadingMsg, setLoadingMsg] = useState("");
      const [textInput, setTextInput] = useState("");
      const [errorMsg, setErrorMsg] = useState("");
      const [difficulty, setDifficulty] = useState("mixed");
      const [ttsEnabled, setTtsEnabled] = useState(() => localStorage.getItem(TTS_STORAGE) !== "off");
      const [gameHistory, setGameHistory] = useState(loadHistory);
      const [newRecord, setNewRecord] = useState(false);
      const { supported: micSupported, listening, transcript, start, stop, setTranscript } = useSpeechRecognition();

      // Единый ответ: голосовой транскрипт попадает в то же поле, что и текст,
      // отправляется всегда textInput — что видишь, то и отправишь
      useEffect(() => {
        if (transcript) setTextInput(transcript);
      }, [transcript]);

      const fallbackIdx = useRef(0);
      const askedRef = useRef([]);        // история вопросов — в ref, чтобы не ловить stale closure
      const prefetchRef = useRef(null);   // промис предзагруженного следующего вопроса
      const topicQueueRef = useRef(null); // очередь тем без повторов
      const gameIdRef = useRef(0);        // защита от «гонки» между старой и новой игрой

      const getTopicQueue = () => {
        if (!topicQueueRef.current) topicQueueRef.current = createTopicQueue(TOPICS);
        return topicQueueRef.current;
      };

      const loadingMessages = [
        "Копаем вопрос из шахты...",
        "Крафтим вопрос...",
        "Спрашиваем у Стива...",
        "Ищем в сундуке...",
        "Зачаровываем вопрос...",
        "Варим вопрос в котле...",
      ];
      const evalMessages = [
        "Оцениваем ответ...",
        "Сверяем с энциклопедией...",
        "Совещаемся с жителями...",
        "Проверяем в вики...",
      ];

      const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const fetchNextQuestion = async (key, diff) => {
        const gameId = gameIdRef.current;
        let q = null;
        if (key) {
          try {
            const topic = getTopicQueue().next();
            const usr = buildQuestionUserPrompt(topic, askedRef.current, diff);
            const raw = await callAI(key, QUESTION_SYSTEM_PROMPT, usr, { temperature: GEN_TEMPERATURE });
            q = normalizeQuestion(parseJSON(raw));
          } catch (e) {
            q = null;
          }
        }
        if (!q) {
          q = pickFallbackQuestion(fallbackIdx.current, diff);
          fallbackIdx.current++;
        }
        if (gameId === gameIdRef.current) askedRef.current = [...askedRef.current, q.question];
        return q;
      };

      const presentQuestion = async (num) => {
        const gameId = gameIdRef.current;
        setScreen("playing");
        setLoading(true);
        setLoadingMsg(pickRandom(loadingMessages));
        setErrorMsg("");
        setEvaluation(null);
        setTextInput("");
        setTranscript("");
        const promise = prefetchRef.current || fetchNextQuestion(apiKey, difficulty);
        prefetchRef.current = null;
        const q = await promise;
        if (gameId !== gameIdRef.current) return; // началась новая игра — этот вопрос уже не нужен
        setCurrentQ(q);
        setLoading(false);
        if (ttsEnabled) speak(q.question);
        // предзагружаем следующий вопрос, пока игрок думает над текущим
        if (num < TOTAL_QUESTIONS) prefetchRef.current = fetchNextQuestion(apiKey, difficulty);
      };

      const evaluateAnswer = async () => {
        const answer = textInput.trim();
        if (!answer) {
          setErrorMsg("Скажи или напиши ответ!");
          return;
        }
        stopSpeaking();
        const gameId = gameIdRef.current;
        setScreen("evaluating");
        setLoading(true);
        setLoadingMsg(pickRandom(evalMessages));
        let ev = null;
        if (apiKey) {
          try {
            const raw = await callAI(apiKey, EVAL_SYSTEM_PROMPT, buildEvalUserPrompt(currentQ, answer), { temperature: EVAL_TEMPERATURE });
            const parsed = parseJSON(raw);
            if (!parsed.score || !parsed.comment) throw new Error("bad format");
            parsed.score = Math.max(1, Math.min(5, Math.round(parsed.score)));
            if (typeof parsed.correct_answer !== "string" || !parsed.correct_answer.trim()) {
              parsed.correct_answer = currentQ.correct_answer;
            }
            ev = parsed;
          } catch (e) {
            ev = null;
          }
        }
        if (!ev) ev = localScore(answer, currentQ);
        if (gameId !== gameIdRef.current) return;
        setEvaluation(ev);
        setScores((prev) => [...prev, ev.score]);
        setLoading(false);
        setScreen("result");
      };

      const handleSaveKey = async () => {
        const key = apiKeyInput.trim();
        if (!key) {
          setApiKeyError("Введите API-ключ");
          return;
        }
        setApiKeyTesting(true);
        setApiKeyError("");
        try {
          await callAI(key, "Ответь одним словом.", "Скажи: ок", { temperature: EVAL_TEMPERATURE, json: false });
          localStorage.setItem(API_KEY_STORAGE, key);
          setApiKey(key);
          setApiKeyInput("");
        } catch (e) {
          setApiKeyError("Ключ не работает: " + (e.message || "ошибка соединения"));
        }
        setApiKeyTesting(false);
      };

      const handleStart = () => {
        gameIdRef.current++;
        stopSpeaking();
        prefetchRef.current = null;
        askedRef.current = [];
        fallbackIdx.current = 0;
        getTopicQueue().reset();
        setScores([]);
        setNewRecord(false);
        setQuestionNum(1);
        presentQuestion(1);
      };

      const finishGame = () => {
        const prevBest = bestTotal(gameHistory);
        const entry = {
          date: new Date().toISOString(),
          total: totalScore,
          scores: scores.slice(),
          difficulty,
        };
        setGameHistory(saveGameResult(entry));
        setNewRecord(gameHistory.length > 0 && totalScore > prevBest);
        setScreen("final");
      };

      const handleNext = () => {
        stopSpeaking();
        if (questionNum >= TOTAL_QUESTIONS) {
          finishGame();
        } else {
          const n = questionNum + 1;
          setQuestionNum(n);
          presentQuestion(n);
        }
      };

      const toggleTts = () => {
        const v = !ttsEnabled;
        setTtsEnabled(v);
        try { localStorage.setItem(TTS_STORAGE, v ? "on" : "off"); } catch (e) {}
        if (!v) stopSpeaking();
      };

      const totalScore = scores.reduce((a, b) => a + b, 0);
      const avgScore = scores.length ? (totalScore / scores.length).toFixed(1) : 0;
      const maxPossible = TOTAL_QUESTIONS * 5;
      const recordTotal = bestTotal(gameHistory);

      const getDiffColor = (d) => d === "easy" ? "#8BC34A" : d === "medium" ? "#FFC107" : "#f44336";
      const getDiffLabel = (d) => d === "easy" ? "Легко" : d === "medium" ? "Средне" : "Сложно";
      const DIFFICULTY_OPTIONS = [
        { value: "mixed", label: "Смешанная" },
        { value: "easy", label: "Легко" },
        { value: "medium", label: "Средне" },
        { value: "hard", label: "Сложно" },
      ];

      const getGrade = () => {
        const avg = totalScore / TOTAL_QUESTIONS;
        if (avg >= 4.5) return { emoji: "🏆", text: "Гений Minecraft!", sub: "Ты знаешь эту игру лучше Нотча!" };
        if (avg >= 3.5) return { emoji: "⛏️", text: "Бывалый шахтёр!", sub: "Отличные знания, так держать!" };
        if (avg >= 2.5) return { emoji: "🪨", text: "Начинающий крафтер", sub: "Неплохо, но есть куда расти!" };
        return { emoji: "🌱", text: "Новичок в шахте", sub: "Играй больше — узнаешь больше!" };
      };

      return (
        <div style={styles.container}>
          <div style={styles.scanlines} />

          {/* ── START ── */}
          {screen === "start" && (
            <div style={styles.centered}>
              <div style={styles.title}>
                <span style={styles.titleIcon}>⛏️</span>
                <div>
                  <div style={styles.titleMain}>MINECRAFT</div>
                  <div style={styles.titleSub}>ВИКТОРИНА</div>
                </div>
                <span style={styles.titleIcon}>🗡️</span>
              </div>
              <div style={styles.subtitle}>Голосовая викторина по Minecraft</div>

              <div style={styles.infoBox}>
                <div style={styles.infoRow}><PixelHeart /> <span>{TOTAL_QUESTIONS} вопросов</span></div>
                <div style={styles.infoRow}><span style={{fontSize:16}}>🎤</span> <span>Отвечай голосом или текстом</span></div>
                <div style={styles.infoRow}><span style={{fontSize:16}}>⭐</span> <span>Оценка от 1 до 5</span></div>
              </div>

              {gameHistory.length > 0 && (
                <div style={styles.recordLine}>
                  🏅 Рекорд: {recordTotal}/{maxPossible} · Последняя игра: {gameHistory[0].total}/{maxPossible}
                </div>
              )}

              <div style={styles.settingsBox}>
                <div style={styles.settingsLabel}>Сложность</div>
                <div style={styles.chipRow}>
                  {DIFFICULTY_OPTIONS.map((opt) => (
                    <button
                      key={opt.value}
                      style={{ ...styles.chip, ...(difficulty === opt.value ? styles.chipActive : {}) }}
                      onClick={() => setDifficulty(opt.value)}
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>
                <button style={styles.ttsToggle} onClick={toggleTts}>
                  {ttsEnabled ? "🔊 Озвучка вопросов: вкл" : "🔇 Озвучка вопросов: выкл"}
                </button>
              </div>

              {/* API Key section */}
              <div style={styles.apiKeyBox}>
                <div style={styles.apiKeyLabel}>
                  {apiKey ? "✓ DeepSeek API-ключ сохранён" : "DeepSeek API-ключ"}
                </div>
                {apiKey ? (
                  <div style={styles.apiKeyRow}>
                    <span style={styles.apiKeyMasked}>···{apiKey.slice(-6)}</span>
                    <button style={styles.btnSmall} onClick={() => { localStorage.removeItem(API_KEY_STORAGE); setApiKey(""); }}>
                      Сменить
                    </button>
                  </div>
                ) : (
                  <>
                    <div style={styles.apiKeyRow}>
                      <input
                        style={{ ...styles.textField, opacity: apiKeyTesting ? 0.5 : 1 }}
                        type="password"
                        placeholder="Введите ключ..."
                        value={apiKeyInput}
                        onChange={(e) => setApiKeyInput(e.target.value)}
                        onKeyDown={(e) => e.key === "Enter" && !apiKeyTesting && handleSaveKey()}
                        disabled={apiKeyTesting}
                      />
                      <button style={{ ...styles.btnSmall, opacity: apiKeyTesting ? 0.6 : 1 }} onClick={handleSaveKey} disabled={apiKeyTesting}>
                        {apiKeyTesting ? "..." : "Сохранить"}
                      </button>
                    </div>
                    {apiKeyTesting && <div style={styles.apiKeyHint}>Проверяем ключ...</div>}
                    {apiKeyError && <div style={styles.errorText}>{apiKeyError}</div>}
                    <div style={styles.apiKeyHint}>
                      Ключ хранится только в вашем браузере.<br/>
                      Без ключа используются встроенные вопросы.
                    </div>
                  </>
                )}
              </div>

              <button style={styles.btnPrimary} onClick={handleStart}>
                ▶ НАЧАТЬ ИГРУ
              </button>
            </div>
          )}

          {/* ── PLAYING ── */}
          {screen === "playing" && (
            <div style={styles.playScreen}>
              <div style={styles.topBar}>
                <div style={styles.topBarItem}>#{questionNum}/{TOTAL_QUESTIONS}</div>
                <div style={styles.topBarItem}>⭐ {totalScore}</div>
              </div>

              {loading ? (
                <div style={styles.centered}>
                  <div style={styles.loader} />
                  <div style={styles.loadingText}>{loadingMsg}</div>
                </div>
              ) : currentQ ? (
                <>
                  <div style={styles.diffBadge}>
                    <span style={{ ...styles.diffDot, background: getDiffColor(currentQ.difficulty) }} />
                    {getDiffLabel(currentQ.difficulty)}
                  </div>
                  <div style={styles.questionCard}>
                    <div style={styles.questionText}>{currentQ.question}</div>
                    {window.speechSynthesis && (
                      <button style={styles.speakBtn} onClick={() => speak(currentQ.question)}>
                        🔊 Прочитать вопрос
                      </button>
                    )}
                  </div>

                  {textInput && (
                    <div style={styles.transcriptBox}>
                      <div style={styles.transcriptLabel}>Твой ответ:</div>
                      <div style={styles.transcriptText}>{textInput}</div>
                    </div>
                  )}

                  {errorMsg && <div style={styles.errorText}>{errorMsg}</div>}

                  <div style={styles.inputArea}>
                    {micSupported && (
                      <button
                        style={{ ...styles.micBtn, ...(listening ? styles.micBtnActive : {}) }}
                        onTouchStart={(e) => { e.preventDefault(); start(); }}
                        onTouchEnd={(e) => { e.preventDefault(); stop(); }}
                        onMouseDown={start}
                        onMouseUp={stop}
                      >
                        <MicIcon active={listening} />
                        <span style={styles.micLabel}>{listening ? "Говори..." : "Зажми и говори"}</span>
                      </button>
                    )}

                    <div style={styles.textInputRow}>
                      <input
                        style={styles.textField}
                        placeholder="...или напиши ответ"
                        value={textInput}
                        onChange={(e) => setTextInput(e.target.value)}
                        onKeyDown={(e) => e.key === "Enter" && evaluateAnswer()}
                      />
                    </div>

                    <button
                      style={{ ...styles.btnPrimary, marginTop: 8, opacity: textInput.trim() ? 1 : 0.5 }}
                      onClick={evaluateAnswer}
                      disabled={!textInput.trim()}
                    >
                      ✓ ОТВЕТИТЬ
                    </button>
                  </div>
                </>
              ) : null}
            </div>
          )}

          {/* ── EVALUATING ── */}
          {screen === "evaluating" && (
            <div style={styles.centered}>
              <div style={styles.loader} />
              <div style={styles.loadingText}>{loadingMsg}</div>
            </div>
          )}

          {/* ── RESULT ── */}
          {screen === "result" && evaluation && (
            <div style={styles.centered}>
              <div style={styles.starsRow}>
                {[1, 2, 3, 4, 5].map((i) => (
                  <StarIcon key={i} filled={i <= evaluation.score} />
                ))}
              </div>
              <div style={styles.scoreLabel}>{evaluation.score} из 5</div>
              <div style={styles.commentBox}>
                <div style={styles.commentText}>{evaluation.comment}</div>
              </div>
              <div style={styles.correctBox}>
                <div style={styles.correctLabel}>Правильный ответ:</div>
                <div style={styles.correctText}>{evaluation.correct_answer}</div>
              </div>
              <button style={styles.btnPrimary} onClick={handleNext}>
                {questionNum >= TOTAL_QUESTIONS ? "🏁 РЕЗУЛЬТАТЫ" : "➡ ДАЛЬШЕ"}
              </button>
            </div>
          )}

          {/* ── FINAL ── */}
          {screen === "final" && (
            <div style={styles.centered}>
              {(() => {
                const g = getGrade();
                return (
                  <>
                    <div style={styles.finalEmoji}>{g.emoji}</div>
                    <div style={styles.finalTitle}>{g.text}</div>
                    <div style={styles.finalSub}>{g.sub}</div>
                    {newRecord && <div style={styles.newRecordBadge}>🏆 Новый рекорд!</div>}
                    <div style={styles.finalStats}>
                      <div style={styles.statItem}>
                        <div style={styles.statValue}>{totalScore}</div>
                        <div style={styles.statLabel}>из {maxPossible}</div>
                      </div>
                      <div style={styles.statDivider} />
                      <div style={styles.statItem}>
                        <div style={styles.statValue}>{avgScore}</div>
                        <div style={styles.statLabel}>средний балл</div>
                      </div>
                    </div>
                    <div style={styles.scoresStrip}>
                      {scores.map((s, i) => (
                        <div key={i} style={{ ...styles.miniScore, background: s >= 4 ? "#4CAF50" : s >= 3 ? "#FFC107" : "#f44336" }}>
                          {s}
                        </div>
                      ))}
                    </div>
                    {!newRecord && recordTotal > 0 && (
                      <div style={styles.recordLine}>🏅 Рекорд: {recordTotal}/{maxPossible}</div>
                    )}
                    <button style={styles.btnPrimary} onClick={handleStart}>
                      🔄 ИГРАТЬ СНОВА
                    </button>
                  </>
                );
              })()}
            </div>
          )}
        </div>
      );
    }

    // ── Стили ──

    const pixelFont = `'Courier New', 'Courier', monospace`;

    const styles = {
      container: {
        minHeight: "100vh",
        background: "linear-gradient(180deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%)",
        fontFamily: pixelFont,

        flexDirection: "column",
      },

        zIndex: 100,
      },
